<svg xmlns="http://www.w3.org/2000/svg" width="2550" height="3300" viewBox="0 0 2550 3300"><rect width="2550" height="3300" fill="#fff"/><rect width="2550" height="300" fill="#000"/><text x="120" y="196" font-family="'Inter Variable', Inter, sans-serif" font-weight="300" font-size="110" letter-spacing="-3.3" fill="#fff">Clio</text><text x="2430" y="180" text-anchor="end" font-family='"SF Mono", Menlo, monospace' font-size="40" letter-spacing="3.2" fill="#fff">CLIO TIMEKEEPING</text><text x="120" y="690" font-family="'Inter Variable', Inter, sans-serif" font-weight="200" font-size="250" letter-spacing="-7.5" fill="#0A0A0A">Stop rebuilding</text><text x="120" y="930" font-family="'Inter Variable', Inter, sans-serif" font-weight="200" font-size="250" letter-spacing="-7.5" fill="#0A0A0A">your week</text><text x="124" y="1070" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="62" fill="#404040">Now available on every Clio Manage plan.</text><rect x="1790" y="430" width="640" height="500" rx="24" fill="#F5F5F5"/><rect x="1840" y="490" width="300" height="26" rx="13" fill="#0A0A0A"/><rect x="1840" y="540" width="200" height="20" rx="10" fill="#CCC4BA"/><rect x="1840" y="620" width="540" height="22" rx="11" fill="#D9E2FB"/><rect x="1840" y="672" width="470" height="22" rx="11" fill="#D9E2FB"/><rect x="1840" y="724" width="380" height="22" rx="11" fill="#D9E2FB"/><rect x="1840" y="820" width="540" height="2" fill="#CCC4BA"/><rect x="2250" y="844" width="130" height="56" rx="28" fill="#1A56FF"/><circle cx="2352" cy="872" r="22" fill="#fff"/><rect x="1840" y="858" width="200" height="22" rx="11" fill="#CCC4BA"/><rect x="120" y="1200" width="730" height="640" rx="20" fill="#D9E2FB"/><text x="180" y="1395" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="56"  fill="#0A0A0A">Time is drafted</text><text x="180" y="1479" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="56"  fill="#0A0A0A">while you work, so</text><text x="180" y="1563" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="56"  fill="#0A0A0A">Friday is for</text><text x="180" y="1647" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="56"  fill="#0A0A0A">checking.</text><rect x="910" y="1200" width="730" height="640" rx="20" fill="#CCC4BA"/><text x="970" y="1395" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="56"  fill="#0A0A0A">You review every</text><text x="970" y="1479" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="56"  fill="#0A0A0A">entry and decide</text><text x="970" y="1563" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="56"  fill="#0A0A0A">what is billed.</text><rect x="1700" y="1200" width="730" height="640" rx="20" fill="#DBCCFF"/><text x="1760" y="1395" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="56"  fill="#0A0A0A">Entries land on</text><text x="1760" y="1479" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="56"  fill="#0A0A0A">your matters, ready</text><text x="1760" y="1563" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="56"  fill="#0A0A0A">for your next bill.</text><rect x="120" y="1980" width="2310" height="1170" rx="20" fill="#F5F5F5"/><text x="220" y="2219" font-family="'Inter Variable', Inter, sans-serif" font-weight="300" font-size="120" letter-spacing="-3.6" fill="#1A56FF">1</text><text x="400" y="2196" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="60"  fill="#0A0A0A">Activities &gt; "My time entries"</text><rect x="220" y="2370" width="2110" height="2" fill="#CCC4BA"/><text x="220" y="2609" font-family="'Inter Variable', Inter, sans-serif" font-weight="300" font-size="120" letter-spacing="-3.6" fill="#1A56FF">2</text><text x="400" y="2586" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="60"  fill="#0A0A0A">Edit with the pencil icon</text><rect x="220" y="2760" width="2110" height="2" fill="#CCC4BA"/><text x="220" y="2999" font-family="'Inter Variable', Inter, sans-serif" font-weight="300" font-size="120" letter-spacing="-3.6" fill="#1A56FF">3</text><text x="400" y="2938" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="60"  fill="#0A0A0A">Switch on "Bill-ready" to add it to</text><text x="400" y="3014" font-family="'Inter Variable', Inter, sans-serif" font-weight="400" font-size="60"  fill="#0A0A0A">the matter's unpaid bills</text></svg>